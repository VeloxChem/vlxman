version: 1
project:
  title: VeloxChem Docs
  copyright: '2025'
  exclude:
    - README.md
  github: veloxchem/vlxman
  bibliography:
    - references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: docs/intro.md
    - title: Getting started
      children:
        - file: docs/limits.md
        - file: docs/installation.md
        - file: docs/run_desktop.ipynb
        - file: docs/run_cluster.ipynb
        - file: docs/restart.ipynb
        - file: docs/keywords.ipynb
        - file: docs/input_files.md
    - title: Model chemistry
      children:
        - file: docs/molecule.ipynb
        - file: docs/refstate.ipynb
        - file: docs/functionals.ipynb
        - file: docs/basis_sets.ipynb
        - file: docs/hamiltonian.ipynb
        - file: docs/embedding.ipynb
        - file: docs/ensembles.ipynb
    - title: Properties
      children:
        - file: docs/pes.ipynb
        - file: docs/uv-vis.ipynb
        - file: docs/first_order_props.ipynb
        - file: docs/polarizability.ipynb
        - file: docs/opt-act.ipynb
        - file: docs/vib-spect.ipynb
        - file: docs/magnetic.md
        - file: docs/weak-interactions.ipynb
        - file: docs/loc_prop.ipynb
        - file: docs/nlo.ipynb
        - file: docs/xray.ipynb
        - file: docs/general-response.ipynb
    - title: Classical methods
      children:
        - file: docs/mm.ipynb
        - file: docs/md.ipynb
        - file: docs/solvation.ipynb
        - file: docs/conf_search.ipynb
        - file: docs/comp_sys_builder.ipynb
        - file: docs/im.ipynb
        - file: docs/evb.md
    - title: Visualization and Analysis
      children:
        - file: docs/mol-vis.ipynb
        - file: docs/elec-vis.ipynb
        - file: docs/opt-vis.ipynb
        - file: docs/spectra-vis.ipynb
        - file: docs/vib-vis.ipynb
        - file: docs/viamd.md
    - title: Advanced users
      children:
        - file: docs/program_struct.ipynb
        - file: docs/source_struct.md
        - file: docs/programming_style.ipynb
    - file: docs/license_citation.md
site:
  options:
    logo: images/logo/vlx-logo-blacktext-halo.png
    favicon: vlx_logo_mark.png
    folders: true
  template: book-theme
